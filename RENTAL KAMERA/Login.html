<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #000000, #ab0000, #c1a400, #FFFFFF); /* Gradasi warna */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px; /* Ubah dari 700px menjadi 900px */
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.8); /* Latar belakang semi-transparan */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .side-text {
            background: linear-gradient(45deg, #000000, #ab0000, #c1a400, #FFFFFF);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-container {
            flex: 1;
            padding: 2rem;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 70%; /* Ubah dari 50% menjadi 70% */
            padding: 1rem; /* Ubah dari 0.5rem menjadi 1rem */
            background-color: #F0A500;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem; /* Ubah dari 1rem menjadi 1.2rem */
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        button:hover {
            background-color: #E45826;
        }
        .signup-link {
            color: #F0A500;
            text-decoration: none;
        }
        .signup-link:hover {
            color: #E45826;
        }
        footer {
            background-color: transparent;
            color: black;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .main-content {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <div id="errorMessage" style="color: red; display: none;"></div>
                <div id="attemptWarning" style="color: red; display: none;">Anda telah salah memasukkan username atau password sebanyak 3 kali. Silakan coba lagi nanti.</div>
                <button type="submit">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">Don't have an account? <a href="sign_up.html" class="signup-link">Sign up</a></p>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Rental Kamera. All rights reserved.</p>
    </footer>
    <script>
        let loginAttemptCount = 0;

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('login_process.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    loginAttemptCount++;
                    document.getElementById('errorMessage').innerText = data.message;
                    document.getElementById('errorMessage').style.display = 'block';
                    if (loginAttemptCount >= 3) {
                        document.getElementById('attemptWarning').style.display = 'block';
                        document.getElementById('loginForm').reset();
                        loginAttemptCount = 0;
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
