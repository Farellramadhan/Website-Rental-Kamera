<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #000000, #ab0000, #c1a400, #FFFFFF); /* Gradasi warna */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px; /* Ubah dari 700px menjadi 900px */
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.8); /* Latar belakang semi-transparan */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .side-text {
            background: linear-gradient(45deg, #000000, #ab0000, #c1a400, #FFFFFF);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-container {
            flex: 1;
            padding: 2rem;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input:invalid {
            border-color: red;
        }
        input:valid {
            border-color: green;
        }
        button {
            width: 70%; /* Ubah dari 50% menjadi 70% */
            padding: 1rem; /* Ubah dari 0.5rem menjadi 1rem */
            background-color: #F0A500;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem; /* Ubah dari 1rem menjadi 1.2rem */
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        button:hover {
            background-color: #E45826;
        }
        .login-link {
            color: #F0A500;
            text-decoration: none;
            display: inline;
        }
        .login-link:hover {
            color: #E45826;
        }
        footer {
            background-color: transparent;
            color: black;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .main-content {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Sign Up</h2>
            <form id="signupForm">
                <label for="name">Nama</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,15}">
                <small style="display: block; margin-bottom: 1rem; color: #555;">
                    Password must be:
                    <ul style="margin: 0.5rem 0 0 1.5rem; padding: 0; list-style-type: disc;">
                        <li>6-15 characters long</li>
                        <li>Include uppercase and lowercase letters</li>
                        <li>Include a number</li>
                        <li>Include a symbol</li>
                    </ul>
                </small>
                <div id="errorMessage" style="color: red; display: none;"></div>
                <button type="submit">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="login.html" class="login-link" style="display: inline;">Login</a></p>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Rental Kamera. All rights reserved.</p>
    </footer>
    <script>
        let attemptCount = 0;

        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('signup_process.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'login.html';
                } else {
                    attemptCount++;
                    document.getElementById('errorMessage').innerText = data.message;
                    document.getElementById('errorMessage').style.display = 'block';
                    if (attemptCount >= 3) {
                        alert('Anda telah salah memasukkan password sebanyak 3 kali. Silakan coba lagi nanti.');
                        document.getElementById('signupForm').reset();
                        attemptCount = 0;
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('errorMessage').innerText = 'An error occurred. Please try again later.';
                document.getElementById('errorMessage').style.display = 'block';
            });
        });
    </script>
</body>
</html>
